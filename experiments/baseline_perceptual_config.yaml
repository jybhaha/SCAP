# Baseline Perceptual Comparison Configuration

# 实验基本设置
experiment:
  name: "baseline_perceptual_comparison"
  description: "对比各个baseline的perceptual效果"
  timestamp: true
  version: "1.0"

# 数据设置
data:
  dataset: "imagenet"
  split: "val"
  batch_size: 4
  max_batches: 5
  image_size: 224
  num_workers: 4

# 模型设置
model:
  name: "resnet50"
  pretrained: true
  device: "cuda"
  num_classes: 1000

# 攻击方法设置
attacks:
  pixel_baseline:
    enabled: true
    method: "pgd"
    epsilon: 0.03
    alpha: 0.01
    iterations: 40
    
  patch_baseline:
    enabled: true
    method: "patch"
    patch_size: 32
    max_patches: 5
    
  scar_method:
    enabled: true
    method: "scar"
    scar_params:
      alpha: 0.1
      beta: 0.01
      gamma: 0.001

# 输出设置
output:
  base_dir: "results/baseline"
  save_adv_images: true  # 新增：控制是否保存对抗样本
  save_metrics: true
  generate_plots: true
  save_logs: true
  perceptual_comparison: true  # 新增：是否进行perceptual比较

# 实验参数
experiment_params:
  max_batches: 5
  batch_size: 4
  device: "cuda"
  num_workers: 4
  targeted_attack: false
  save_adv_images: true  # 在config中控制 