[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scap-attack"
version = "1.1.0"
description = "Semantic-guided contextual adversarial patch research toolbox"
requires-python = ">=3.10,<3.11"

[tool.setuptools.packages.find]
include = ["attack*", "configs*", "data*", "experiments*", "models*", "utils*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "pretrained: tests that instantiate pretrained models or download weights (disabled by default)",
]
